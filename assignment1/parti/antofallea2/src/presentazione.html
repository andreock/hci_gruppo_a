<title>Assignment 1 – Valutazione euristica di IdeaGinger: Partner, Servizi, Come funziona</title>
<style>
  @page { size: 1280px 720px; margin: 0; }
  :root {
    --ink: #172033; --muted: #5b6577; --line: #dfe3ea; --bg: #ffffff; --soft: #f4f6fa;
    --accent: #1d3fd8; --accent-soft: #e8ecfd; --warm: #f28c00;
    --s1: #8a94a6; --s2: #e0a100; --s3: #e2570c; --s4: #b3141c; --ok: #1a8a4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #cfd4dc; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: var(--ink); font-size: 16px; line-height: 1.4; }
  .slide { width: 1280px; height: 720px; background: var(--bg); position: relative; overflow: hidden; page-break-after: always; break-after: page; padding: 32px 44px 40px; display: flex; flex-direction: column; }
  @media screen { .slide { margin: 16px auto; box-shadow: 0 2px 14px rgba(0,0,0,.25); } }
  .foot { position: absolute; left: 44px; right: 44px; bottom: 12px; display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); }
  .kicker { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 3px; }
  h1 { font-size: 27px; line-height: 1.15; margin: 0 0 14px; font-weight: 700; letter-spacing: -.01em; }
  h2 { font-size: 18px; margin: 0 0 7px; }
  p { margin: 0 0 8px; }
  ul { margin: 0; padding-left: 18px; } li { margin-bottom: 4px; }
  .grow { flex: 1; min-height: 0; }
  .cols { display: grid; gap: 22px; }
  .muted { color: var(--muted); }
  .small { font-size: 13.5px; }

  .cover { background: linear-gradient(135deg, #14235e 0%, #1d3fd8 62%, #3b6bff 100%); color: #fff; justify-content: center; padding: 60px 80px; }
  .cover h1 { font-size: 46px; margin-bottom: 14px; }
  .cover .sub { font-size: 20px; opacity: .92; max-width: 860px; }
  .cover .meta { margin-top: 44px; display: grid; grid-template-columns: repeat(4, auto); gap: 34px; justify-content: start; font-size: 13px; }
  .cover .meta b { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; font-weight: 600; margin-bottom: 2px; }
  .cover .tag { display: inline-block; background: var(--warm); color: #1b1300; font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 5px 12px; border-radius: 20px; margin-bottom: 22px; align-self: flex-start; }

  .card { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 13px 15px; }
  .card h2 { font-size: 16.5px; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
  th { text-align: left; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--ink); padding: 5px 8px; }
  td { border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
  .sev { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; border-radius: 6px; color: #fff; font-weight: 700; font-size: 12.5px; padding: 0 6px; }
  .sev1 { background: var(--s1); } .sev2 { background: var(--s2); color: #2a1e00; } .sev3 { background: var(--s3); } .sev4 { background: var(--s4); } .sev0 { background: #c9ced8; color: #333; }
  .pill { display: inline-block; border-radius: 20px; padding: 2px 9px; font-size: 11px; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .pill.ok { background: #e2f5ea; color: var(--ok); } .pill.warn { background: #fdf1d2; color: #7a5600; } .pill.bad { background: #fde4d9; color: #a53a00; }
  .id { font-family: Consolas, "Courier New", monospace; font-weight: 700; color: var(--accent); }

  /* schede problema */
  .prob { display: grid; grid-template-columns: 640px 1fr; gap: 24px; }
  .figs { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .figs.row { flex-direction: row; align-items: flex-start; gap: 14px; }
  figure { margin: 0; min-height: 0; display: flex; flex-direction: column; flex: none; }
  figure img { max-width: 100%; object-fit: contain; object-position: top left; border: 1px solid var(--line); border-radius: 6px; align-self: flex-start; }
  .figs.n1 img { max-height: 540px; } .figs.n2 img { max-height: 250px; } .figs.row img { max-height: 540px; }
  figcaption { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  figcaption b { color: var(--ink); }
  .ptitle { display: flex; gap: 10px; align-items: baseline; margin-bottom: 7px; }
  .ptitle h2 { font-size: 19px; line-height: 1.2; margin: 0; }
  .where { font-size: 12.3px; color: var(--muted); margin-bottom: 9px; }
  .where b { color: var(--ink); font-weight: 600; }
  dl { margin: 0; display: grid; grid-template-columns: 1fr; gap: 8px; }
  dl > div { border-left: 3px solid var(--line); padding-left: 10px; }
  dt { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
  dd { margin: 1px 0 0; font-size: 14.6px; line-height: 1.36; }
  dl > div.heur { border-color: var(--accent); } dl > div.fix { border-color: var(--ok); background: #f1faf4; padding: 6px 10px; border-radius: 0 6px 6px 0; }
  dl > div.s1 { border-color: var(--s1); } dl > div.s2 { border-color: var(--s2); } dl > div.s3 { border-color: var(--s3); }
  .fip { display: flex; gap: 6px; margin: 3px 0 4px; flex-wrap: wrap; }
  .fip span { font-size: 11px; border: 1px solid var(--line); border-radius: 20px; padding: 1px 8px; color: var(--muted); background: #fff; }
  .fip b { color: var(--ink); }

  .apx .sev { height: 17px; min-width: 17px; font-size: 11px; border-radius: 4px; padding: 0 4px; }
  .ev { align-self: start; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); padding: 16px 18px; }
  .evt { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
  .evi { font-size: 14.5px; padding: 9px 0; border-top: 1px solid var(--line); }
  .bars { display: grid; grid-template-columns: 300px 1fr 30px; gap: 9px 10px; align-items: center; font-size: 14px; }
  .bar { display: flex; height: 18px; gap: 2px; }
  .bar span { display: block; height: 100%; border-radius: 3px; }

  /* schemi di riprogettazione */
  .mock { border: 1px solid #c8cfdb; border-radius: 10px; background: #fff; overflow: hidden; font-size: 13.5px; box-shadow: 0 1px 5px rgba(0,0,0,.08); align-self: start; }
  .mock .bar-top { background: #f28c00; height: 8px; }
  .mock .mhead { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; border-bottom: 1px solid #eee; font-size: 11px; font-weight: 600; }
  .mock .mbody { padding: 12px 14px; }
  .btn { display: inline-block; background: #05b81f; color: #fff; font-weight: 700; padding: 7px 14px; border-radius: 20px; font-size: 12px; }
  .btn.alt { background: #fff; color: #1d3fd8; border: 2px solid #1d3fd8; }
  .btn.or { background: #f28c00; }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .phones { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; align-self: start; }
  .phones figure img { border-radius: 12px; border: 2px solid #222; max-height: 420px; }
</style>

<script>
const H = {
  1: 'Visibilità dello stato del sistema', 2: 'Corrispondenza tra sistema e mondo reale', 3: 'Controllo e libertà dell’utente',
  4: 'Coerenza e standard', 5: 'Prevenzione degli errori', 6: 'Riconoscimento anziché ricordo', 7: 'Flessibilità ed efficienza d’uso',
  8: 'Design estetico e minimalista', 9: 'Aiutare a riconoscere, diagnosticare e correggere gli errori', 10: 'Aiuto e documentazione'
};
const PG = {
  menu: 'Menu globale «Partner» (pannello aperto dalla barra, da ogni pagina)', collab: '«Collaborazioni» (/collaborazioni.html)',
  servizi: '«Servizi» (/servizi.html)', come: '«Come funziona» (/ginger_come-funziona.html)', contatti: '«Contatti» (/ginger_contatti.html)',
  ext: 'Destinazioni dei pulsanti di «Servizi» (gingeracademy.it, gingercrowdfunding.it)', form: '«Formazione» (/ginger_formazione.html)', ppage: 'Pagine dei partner (/partner/…)'
};
const T = {
  1: 'T1 Trovare un partner e aprirne la pagina', 2: 'T2 Capire quali partner fanno al caso proprio', 3: 'T3 Servizi offerti e costi',
  4: 'T4 Trovare il prossimo corso di formazione', 5: 'T5 Capire i passi per lanciare una campagna', 6: 'T6 Costo di pubblicazione e contatti'
};
const LV = { A: 'alta', M: 'media', B: 'bassa' }, LVI = { A: 'alto', M: 'medio', B: 'basso' };

const P = [
 { id:'P01', h:1, sev:2, f:['A','M','M'], title:'Nel menu «Partner» l’elenco continua oltre lo schermo senza alcun segnale', page:['menu'], task:[1,2],
   figs:[['menu_d.jpg','Menu «Partner» a 1366 × 768: l’ultima voce visibile è «BCC Busto Garolfo e Buguggiate»; ne seguono altre sette.']],
   prob:`Il menu si apre come pannello a tutto schermo con 25 voci. A 1366 × 768 le ultime sette («Comune di Forlì», «Federcasse», «Top Metro Fa Bene», le due Federazioni, le due Fondazioni) restano sotto il bordo: il contenuto del pannello è alto 1.030 px e scorre, ma non compare una barra di scorrimento e in basso c’è solo una decorazione. Chi cerca uno di quei partner può concludere che non c’è.`,
   heur:`Il sistema non mostra che una parte dell’elenco è nascosta: lo stato del pannello (scorribile) non è visibile.`,
   sevj:`Riguarda chiunque apra il menu su uno schermo da portatile; il danno tocca chi cerca uno degli ultimi sette partner. Una volta scoperto lo scorrimento il problema si attenua.`,
   fix:`Elenco su più colonne, in modo che stia in una schermata, oppure barra di scorrimento sempre visibile e sfumatura sul bordo inferiore.` },
 { id:'P02', h:1, sev:2, f:['A','B','A'], title:'Né la barra né il menu indicano che ci si trova nella sezione Partner', page:['menu','ppage','servizi'], task:[1],
   figs:[['nav_partner.jpg','Pagina partner dell’Università di Torino: «PARTNER» ha lo stesso colore delle altre voci.'],['nav_servizi.jpg','Pagina «Servizi»: la voce corrente è evidenziata in arancione.']],
   prob:`Sulla pagina «Servizi» la voce di menu corrente è evidenziata in arancione; sulla pagina di un partner la voce «PARTNER» resta grigio scuro come le altre. Anche dentro il pannello la voce del partner che si sta guardando non è distinta dalle altre 24. Chi passa da un partner all’altro deve ricordare quali ha già aperto.`,
   heur:`La posizione dell’utente nel sito è segnalata in una sezione e non nell’altra; nell’elenco manca l’indicazione «sei qui».`,
   sevj:`Tocca ogni visita alla sezione, ma il titolo della pagina dice comunque dove ci si trova: l’effetto è un rallentamento.`,
   fix:`Evidenziare «PARTNER» nella barra quando si è in una pagina partner e marcare nell’elenco la voce corrente.` },
 { id:'P03', h:1, sev:1, f:['A','B','A'], title:'Il titolo della scheda del browser è lo stesso della home in «Servizi» e «Collaborazioni»', page:['servizi','collab'], task:[3,2],
   ev:['Titolo della scheda in «Servizi» e in «Collaborazioni»:<br><b>«GINGER: la piattaforma di crowdfunding con il più alto tasso di successo in Italia!»</b>','Titolo della scheda in «Come funziona»: <b>«Come funziona»</b>','Titolo della scheda nella pagina partner dell’Università di Torino: <b>«Università di Torino»</b>'],
   prob:`«Servizi» e «Collaborazioni» hanno lo stesso titolo della home, mentre «Come funziona» e le pagine partner hanno un titolo proprio. Poiché molti link del sito aprono nuove schede del browser (P05, P10), chi ne ha più d’una aperta non le distingue; lo stesso vale per cronologia e preferiti.`,
   heur:`Il titolo della scheda è il primo indicatore di «dove sono» fuori dalla pagina, e qui non lo dice.`,
   sevj:`Fastidio lieve, che non blocca alcun task.`,
   fix:`Titoli specifici: «Servizi – Ginger», «Collaborazioni – Ginger».` },
 { id:'P04', h:2, sev:2, f:['M','M','A'], title:'La pagina «Servizi» non dice quali sono i servizi né quanto costano', page:['servizi','ext'], task:[3],
   figs:[['servizi_top.jpg','«Servizi», prima schermata a 1366 × 768: l’illustrazione occupa quasi tutto lo spazio.'],['servizi_text.jpg','Il blocco «Formazione»: un testo promozionale e un pulsante.']],
   prob:`La voce «Servizi» fa attendere un elenco di servizi con contenuti e prezzi. La pagina contiene due blocchi, «Formazione» e «Pacchetti Ginger», ciascuno con un testo promozionale e un pulsante. Non compare alcuna cifra, e dei pacchetti si legge soltanto «preferiremmo che fossi tu a raccontarcelo». Nemmeno la pagina di destinazione del pulsante («Management», su un altro sito) riporta prezzi. Su desktop il primo testo inizia a 647 px, dopo un’illustrazione alta circa 500 px.`,
   heur:`L’etichetta promette un’informazione concreta che la pagina non dà: il contenuto non corrisponde a ciò che l’utente si aspetta da quella parola.`,
   sevj:`Chi valuta se affidarsi a Ginger non ottiene il dato che cerca e deve scrivere o telefonare. Riguarda solo i futuri progettisti.`,
   fix:`Una scheda per servizio con che cosa comprende, a chi serve e il prezzo (o «da … €» e «su preventivo»), seguita dal pulsante di approfondimento.` },
 { id:'P05', h:3, sev:2, f:['M','M','A'], title:'I pulsanti di «Servizi» portano su altri siti, in una nuova scheda, senza avviso', page:['servizi','ext'], task:[3,4],
   figs:[['servizi_pack.jpg','«Scopri i pacchetti Ginger»: nessun segno che il pulsante porti fuori dal sito.'],['ext_management.jpg','La destinazione: pagina «Management» su gingercrowdfunding.it, con un altro menu.']],
   prob:`«Scopri il prossimo evento» e «Scopri i pacchetti Ginger» aprono una nuova scheda del browser su domini diversi: il primo arriva alla home di gingeracademy.it, il secondo a gingercrowdfunding.it. I pulsanti non hanno l’icona di link esterno che il footer usa per «Cookies» e «Blog». Sulla pagina «Management» il menu è un altro e non c’è alcun link verso ideaginger.it: per tornare bisogna ritrovare la scheda precedente.`,
   heur:`Il cambio di sito non è annunciato e dalla destinazione manca un’uscita chiara verso il punto di partenza.`,
   sevj:`Capita a chiunque approfondisca i servizi. Il rimedio (chiudere la scheda) esiste, ma non è evidente, soprattutto su smartphone.`,
   fix:`Icona e dicitura «si apre su gingeracademy.it» sui pulsanti; nelle pagine di destinazione un link «Torna a Ideaginger.it».` },
 { id:'P06', h:3, sev:1, f:['A','B','A'], title:'Il menu «Partner» a tutto schermo si chiude solo con la X', page:['menu'], task:[1],
   figs:[['menu_close.jpg','L’unico comando di chiusura è la X in alto a destra.']],
   prob:`Il pannello copre l’intera finestra. Il tasto Esc non lo chiude e nemmeno un clic su un’area vuota: l’unica via è la X in alto a destra, lontana dall’elenco che sta a sinistra. La X non ha un’etichetta testuale. Chi ha aperto il menu per sbaglio o solo per dare un’occhiata deve attraversare lo schermo con il puntatore.`,
   heur:`Per uscire da uno stato aperto magari per errore c’è un solo comando, senza le alternative abituali.`,
   sevj:`Un secondo in più a ogni apertura; la X è grande (55 × 58 px) e ben visibile.`,
   fix:`Chiusura anche con Esc e con clic fuori dall’elenco; etichetta «Chiudi» accanto alla X.` },
 { id:'P07', h:4, sev:2, f:['M','M','A'], title:'La stessa cosa ha nomi e destinazioni diversi: «Formazione», «Pacchetti», «Management»', page:['servizi','come','form','ext'], task:[4,3],
   figs:[['ext_academy.jpg','«Scopri il prossimo evento» porta alla home di Ginger Academy, non a un evento.'],['formazione_int.jpg','La voce «Formazione» della colonna laterale apre invece una pagina interna.']],
   prob:`Per la formazione esistono tre ingressi con tre destinazioni: il pulsante «Scopri il prossimo evento» di «Servizi» apre la home di gingeracademy.it; il link «qui» di «Come funziona» apre una pagina dei corsi dello stesso sito; la voce «Formazione» della colonna laterale apre una pagina interna, che a sua volta rimanda alla home di Academy. Il pulsante «Scopri i pacchetti Ginger» apre una pagina intitolata «Management». L’utente non sa se sta guardando la stessa offerta.`,
   heur:`Parole diverse per la stessa cosa e la stessa parola per destinazioni diverse: l’utente deve chiedersi se indicano lo stesso contenuto.`,
   sevj:`Rallenta T4: «prossimo evento» non porta a una data ma a una home da esplorare. Si ripresenta a ogni accesso.`,
   fix:`Un solo percorso per la formazione, con la stessa etichetta ovunque e destinazione diretta al calendario dei corsi; stesso nome per pulsante e pagina dei pacchetti.` },
 { id:'P08', h:4, sev:2, f:['M','M','A'], title:'«Partner» e «Collaborazioni» sono due elenchi di organizzazioni non collegati tra loro', page:['menu','collab'], task:[2],
   figs:[['collab.jpg','«Collaborazioni»: 54 loghi senza nome in testo e non cliccabili.']],
   prob:`Il menu «Partner» elenca 25 nomi in testo, ciascuno con la sua pagina. La pagina «Collaborazioni», raggiungibile dal footer, mostra 54 loghi: nessuno è un link e non c’è testo. Molte organizzazioni compaiono in entrambi, con nomi scritti in modo diverso («Università di Torino» nel menu, «Università degli Studi di Torino» tra i loghi). Nelle tre visite l’ordine dei loghi era ogni volta diverso. Non è spiegata la differenza tra «partner» e «collaborazione».`,
   heur:`Due elenchi simili, con nomi, forma e comportamento diversi, senza che sia chiaro se indicano la stessa cosa.`,
   sevj:`Chi riconosce il logo della propria banca non può arrivare alla sua pagina e deve tornare al menu. Non blocca, ma disorienta a ogni visita.`,
   fix:`Un’unica pagina «Partner e collaborazioni» con logo e nome, link alla pagina del partner dove esiste e ordine stabile.` },
 { id:'P09', h:4, sev:2, f:['A','M','A'], title:'Contrasto insufficiente: nomi colorati nel menu «Partner», testo bianco su arancione in «Servizi»', page:['menu','servizi'], task:[1,3],
   figs:[['menu_d_scrolled.jpg','Menu «Partner»: quattro delle voci con il contrasto più basso.'],['servizi_pack.jpg','«Servizi»: testo bianco di 14,4 px su fondo arancione.']],
   prob:`Nel menu ogni partner ha un colore diverso, 25 in tutto, senza legenda né significato apparente. Calcolando il contrasto con il bianco dai colori dichiarati nella pagina, 14 voci su 25 restano sotto 4,5:1 e 7 sotto 3:1; il minimo è 1,8:1 («Federazione BCC dell’Emilia-Romagna», giallo). In «Servizi» il testo è bianco, a 14,4 px, su arancione: 2,4:1. I pulsanti verdi con scritta bianca arrivano a 2,1:1. Alcuni nomi e interi paragrafi risultano faticosi da leggere.`,
   heur:`Non è rispettato lo standard di leggibilità più diffuso sul web (WCAG 2.1, livello AA: 4,5:1 per il testo normale) e il colore è usato senza una convenzione.`,
   sevj:`Colpisce tutti, di più chi ha vista ridotta o uno schermo poco luminoso; il testo resta decifrabile con sforzo.`,
   fix:`Un solo colore scuro per i nomi dei partner (il colore del marchio solo come pallino o logo); in «Servizi» testo scuro su fondo chiaro o arancione più scuro.` },
 { id:'P10', h:4, sev:2, f:['A','B','A'], title:'In «Come funziona» tre link si chiamano «qui» e un invito non è cliccabile', page:['come'], task:[5,4],
   figs:[['come_qui.jpg','Due dei tre link «qui»: portano a due pagine diverse.'],['come_servizi.jpg','«Scopri i servizi aggiuntivi!» è testo semplice, senza link.']],
   prob:`La pagina contiene tre link con testo «qui», che portano a tre destinazioni diverse (registrazione, pagina dei corsi di Ginger Academy, home di Ginger Academy) e aprono tutti una nuova scheda. Per capire dove porta ciascuno bisogna rileggere la frase. Al contrario, la frase «Scopri i servizi aggiuntivi!» sembra un invito all’azione ma non è un link, anche se la pagina «Servizi» esiste.`,
   heur:`È disattesa la convenzione per cui il testo di un link ne descrive la destinazione e ciò che invita a un’azione è cliccabile.`,
   sevj:`Piccolo costo a ogni lettura; nessun task è impedito, perché «Servizi» è anche nella barra.`,
   fix:`Testi descrittivi («apri un profilo», «calendario dei corsi», «iniziative dei partner») e link su «servizi aggiuntivi».` },
 { id:'P11', h:4, sev:1, f:['M','B','A'], title:'Orari di contatto diversi tra «Come funziona» e «Contatti»', page:['come','contatti'], task:[6],
   figs:[['come_orari.jpg','«Come funziona»: dalle 9:30 alle 16:30.'],['contatti_orari.jpg','«Contatti»: dalle 09:30 alle 13:00 e dalle 14:00 alle 16:30.']],
   prob:`«Come funziona» indica che il team risponde «dal lunedì al venerdì dalle 9:30 alle 16:30»; «Contatti» indica «dalle 09:30 alle 13:00 e dalle 14:00 alle 16:30». Chi ha letto solo la prima pagina può telefonare tra le 13 e le 14 senza trovare nessuno.`,
   heur:`La stessa informazione è riportata in due modi diversi in due pagine dello stesso sito.`,
   sevj:`Riguarda un’ora al giorno e solo chi telefona.`,
   fix:`Scrivere gli orari in un unico punto e richiamarli dalle altre pagine con lo stesso testo.` },
 { id:'P12', h:6, sev:3, f:['M','A','A'], title:'Il menu «Partner» mostra solo nomi: per sapere che cosa offre un partner bisogna aprirli uno a uno', page:['menu'], task:[2],
   figs:[['menu_plain.jpg','Menu «Partner»: 25 nomi, senza tipo di ente, territorio o stato delle iniziative.']],
   prob:`L’elenco riporta soltanto i nomi: non dice se il partner è una banca, un’università o un ente, in quale territorio opera, né se ha un’iniziativa aperta. Le voci non sono raggruppate e non sono in ordine alfabetico (l’ordine era già segnalato nella parte 1, P12). «Come funziona» invita a verificare se «il tuo territorio o settore è di pertinenza di uno dei nostri partner», ma per rispondere bisogna aprire fino a 25 pagine e ricordarne il contenuto.`,
