<style>

  .mock .bar-top { background: #f28c00; height: 8px; }

  .btn.alt { background: #fff; color: #1d3fd8; border: 2px solid #1d3fd8; }
  .btn.or { background: #f28c00; }

  .phones figure img { border-radius: 12px; border: 2px solid #222; max-height: 420px; }

<script>
const H = {

  4: 'Coerenza e standard', 5: 'Prevenzione degli errori', 6: 'Riconoscimento anziché ricordo', 7: 'Flessibilità ed efficienza d’uso',
  8: 'Design estetico e minimalista', 9: 'Aiutare a riconoscere, diagnosticare e correggere gli errori', 10: 'Aiuto e documentazione'
};
const PG = {
  partner: 'Partner UniTo, scheda «Partnership» (/partner/universita-di-torino.html)', lista: 'Partner UniTo, scheda «Progetti» (/partner-progetti/universita-di-torino.html)',
  fbr: 'Progetto «Fai Brillare la Ricerca!»', bright: 'Progetto «BRIGHT»', milk: 'Campagna attiva «MILK-ACT»',
  checkout: 'Modulo di donazione (…/milk-act-…/donazione.html)', e404: 'Pagina 404', cerca: 'Ricerca progetti (menu «Cerca progetti»)', help: '«Come funziona» e FAQ', menu: 'Menu globale «Partner»', signup: '«Lancia una campagna» (/areaprogettisti/signup.html)'
};
const T = {
  1: 'T1 Capire Funds TOgether', 2: 'T2 Trovare e scegliere un progetto', 3: 'T3 Obiettivi, proponenti, uso dei fondi', 4: 'T4 Stato della campagna',
  5: 'T5 Sostenere un progetto', 6: 'T6 Chiarimenti sul crowdfunding', 7: 'T7 Candidare un progetto di ricerca', 8: 'T8 Recupero da indirizzo errato'
};
const LV = { A: 'alta', M: 'media', B: 'bassa' }, LVI = { A: 'alto', M: 'medio', B: 'basso' };

// ---------------------------------------------------------------- problemi
// figs: [file, didascalia, larghezza % (solo layout affiancato)] · f: [frequenza, impatto, persistenza]
const P = [
 { id:'P01', h:1, sev:3, f:['A','A','A'], title:'Non si capisce se la call 2026 è aperta, chiusa o in corso', page:['partner','lista'], task:[7,1],
   figs:[['partner_fasi.jpg','Le quattro fasi sono descritte al futuro e senza date.'],['partner_blog.jpg','Gli «aggiornamenti più recenti» sono del 2021 e del 2022.']],
   prob:`La pagina descrive l’edizione al futuro («verranno selezionati», «potranno candidare») e non riporta alcuna data: né apertura o scadenza delle candidature, né periodo delle campagne. Intanto la scheda «Progetti» mostra cinque campagne UniTo in corso, con 29–37 giorni rimasti, e il blocco «aggiornamenti più recenti» propone due articoli del 01/12/2021 e del 27/01/2022. Un ricercatore non capisce se può ancora candidarsi; un cittadino dubita che l’iniziativa sia attiva.`,
   heur:`Il sistema non dice in che punto del ciclo si trova l’iniziativa: lo stato va dedotto incrociando due schede e contenuti datati.`,
   sevj:`Riguarda tutti gli utenti di T7 a ogni visita e l’informazione mancante decide se proseguire. Non è 4 perché il dato è recuperabile sul sito unito.it.`,
   fix:`Fascia di stato sotto il titolo, con date («Candidature chiuse il … · campagne attive fino al …»), e timeline delle quattro fasi con quella corrente evidenziata. Blocco del blog intitolato «La storia di Funds TOgether» o nascosto se non aggiornato.` },
 { id:'P02', h:1, sev:3, f:['A','A','A'], title:'Sui progetti conclusi il box «SOSTIENI» sembra ancora attivo', page:['bright','fbr'], task:[5,4], row:true,
   figs:[['bright_status.jpg','BRIGHT: «progetto concluso» in piccolo; sotto, l’intestazione «SOSTIENI» e il pallino rosso.',38],['fbr_faitu.jpg','Fai Brillare la Ricerca!: campo importo «FAI TU» ancora compilabile.',38]],
   prob:`Le due campagne sono chiuse (05/11/2024 e 15/01/2022), ma la colonna destra mantiene il titolo arancione «SOSTIENI» e l’elenco delle ricompense con i prezzi (11 voci su BRIGHT, 9 su Fai Brillare la Ricerca!, compresa la donazione libera «FAI TU»). I pulsanti non ci sono, ma in «FAI TU» resta un campo importo in cui si può scrivere. Nessun testo dice che la raccolta è chiusa: l’unico indizio è un pallino rosso senza legenda. Chi cerca come donare non trova il comando e non sa se è un errore.`,
   heur:`Lo stato «non si può più donare» non è visibile nel punto in cui l’utente agisce; l’interfaccia suggerisce il contrario.`,
   sevj:`Verificato su entrambi i progetti conclusi analizzati; i conclusi sono 13 dei 18 in elenco. Porta a un vicolo cieco su un task centrale, senza alternative proposte.`,
   fix:`Sostituire il box con un pannello «Raccolta conclusa il …», ricompense in sola lettura sotto «Ricompense assegnate», campo importo rimosso e link «Scopri le campagne UniTo attive».` },
 { id:'P03', h:1, sev:2, f:['A','B','M'], title:'Il modulo di donazione non indica i passi né l’effetto di «Dona adesso!»', page:['checkout'], task:[5],
   figs:[['checkout_end.jpg','Fine del modulo: l’unico comando è «DONA ADESSO! – DONATE!».']],
   prob:`La pagina «Checkout» è un unico modulo, senza indicatore di avanzamento. Il pulsante finale «DONA ADESSO! – DONATE!» fa pensare a un addebito immediato; in realtà, come dice solo il testo descrittivo di ciascun metodo, si viene reindirizzati a PayPal o Satispay oppure si ricevono le coordinate per il bonifico. L’importo compare soltanto nel primo campo in cima al modulo, lontano dal pulsante.`,
   heur:`L’utente non sa a che punto del processo si trova né che cosa accadrà premendo il comando principale.`,
   sevj:`Crea esitazione nel momento più delicato, quello in cui si impegna denaro, per ogni donatore. Il percorso resta completabile.`,
   fix:`Indicatore «1 Dati → 2 Pagamento → 3 Conferma»; etichetta del pulsante legata al metodo scelto («Continua su PayPal», «Ricevi le coordinate»); riga di riepilogo «Stai donando € 15 a MILK-ACT» accanto al pulsante.` },
 { id:'P04', h:2, sev:2, f:['A','M','B'], title:'I giorni rimanenti sono scritti come numero negativo («-36 giorni»)', page:['lista','milk','cerca'], task:[4,2],
   figs:[['lista_cards.jpg','Schede delle campagne in corso: «-36 giorni», «-37 giorni».'],['milk_days.jpg','Pagina MILK-ACT: «-36» è uno dei numeri più evidenti del riquadro.']],
   prob:`Il tempo residuo è espresso con il segno meno («-36 giorni», «-37 giorni», «-29 giorni»), come in un conto alla rovescia tecnico. Nel linguaggio comune «-36 giorni» si legge «scaduto da 36 giorni»: una campagna attiva sembra chiusa, proprio accanto a quelle davvero concluse.`,
   heur:`Il sistema usa una notazione interna al posto dell’espressione che l’utente userebbe («mancano 36 giorni»).`,
   sevj:`Compare su ogni campagna attiva, in elenco, nei risultati di ricerca e nella pagina progetto. L’equivoco si scioglie notando «Scade il 17/11/2026» sotto il titolo della pagina progetto, quindi dopo la prima volta pesa meno.`,
   fix:`Scrivere «36 giorni rimasti» (e «ultimo giorno») e riportare la data di scadenza anche nelle schede dell’elenco.` },
 { id:'P05', h:2, sev:2, f:['M','M','M'], title:'Gli aggiornamenti precedono la presentazione del progetto', page:['bright'], task:[3],
   figs:[['bright_order.jpg','BRIGHT, scheda «Progetto»: dopo il sommario, il primo blocco è «NUOVO OBIETTIVO – Aggiornamento».']],
   prob:`Nella scheda «Progetto» di BRIGHT i blocchi «Nuovo obiettivo» («Aggiornamento», poi «Secondo obiettivo») stanno prima del testo che presenta il team e l’idea, e sono in ordine cronologico inverso. La presentazione («Buongiorno, avventurieri!») inizia circa 3.700 px dopo la barra delle schede: quasi cinque schermate a 1366 × 768. Chi arriva per la prima volta legge del terzo obiettivo e delle cuffie fNIRS prima di sapere che cosa sia il progetto.`,
   heur:`L’informazione non segue l’ordine naturale per un nuovo visitatore: prima che cos’è, poi come sta andando.`,
   sevj:`Aumenta lo sforzo su T3 nei progetti che rilanciano l’obiettivo. Il sommario in testa attenua il problema e il contenuto resta reperibile scorrendo.`,
   fix:`In alto una sola riga di stato («2 obiettivi aggiuntivi raggiunti – dettagli»); i blocchi di aggiornamento dopo la presentazione oppure nella scheda «News».` },
 { id:'P06', h:2, sev:1, f:['A','B','B'], title:'Termini inglesi e gergo interno in un sito in italiano', page:['lista','partner','checkout','bright'], task:[2,5],
   figs:[['checkout_top.jpg','Modulo di donazione: titolo «Checkout», etichette «Total amount €», «Notes backer».']],
   prob:`Diverse etichette sono in inglese o in gergo di piattaforma: «by» davanti al proponente, «Overfunding» tra i contatori, «Checkout» e «Notes backer» nel modulo, «i gloriosi GINGERs» nell’elenco dei sostenitori, «Partnership» come nome della scheda che descrive l’iniziativa. Funds TOgether si rivolge anche a cittadini che non conoscono il crowdfunding.`,
   heur:`Parole del dominio della piattaforma al posto di quelle dell’utente.`,
   sevj:`Termini isolati, quasi sempre comprensibili dal contesto: l’effetto è cumulativo ma lieve.`,
   fix:`«di» al posto di «by»; «Raccolto in media il 369% dell’obiettivo»; «Completa la donazione»; «L’iniziativa» al posto di «Partnership».` },
 { id:'P07', h:3, sev:2, f:['A','B','A'], title:'Un link interno apre una nuova scheda del browser e «Indietro» non funziona', page:['partner'], task:[2],
   figs:[['partner_cta.jpg','«Scopri tutti i progetti!» e la voce «Progetti» portano alla stessa pagina, ma solo il pulsante apre una nuova scheda.']],
   prob:`Il pulsante «Scopri tutti i progetti!» porta alla scheda «Progetti» dello stesso sito ma con target="_blank": si apre una nuova scheda del browser e il tasto Indietro non riporta alla descrizione. La voce «Progetti» della barra, con la stessa destinazione, apre invece nella scheda corrente. Anche «Scopri la guida dell’iniziativa» apre unito.it in una nuova scheda senza l’icona di link esterno che il footer usa per «Cookies» e «Blog».`,
   heur:`L’uscita naturale da un passo (Indietro) non è disponibile e il cambio di contesto non è annunciato.`,
   sevj:`È il pulsante principale del percorso T1→T2, quindi lo incontrano quasi tutti; il danno è un disorientamento breve, più marcato su mobile dove le schede aperte non si vedono.`,
   fix:`Aprire i link interni nella stessa scheda; per quelli esterni aggiungere l’icona e il nome del sito di destinazione («su unito.it»).` },
 { id:'P08', h:3, sev:2, f:['M','M','M'], title:'Dal modulo di donazione non si può cambiare ricompensa né annullare', page:['checkout'], task:[5],
   figs:[['checkout_summary.jpg','Il riepilogo a destra è in sola lettura: nessun comando «Modifica» o «Annulla».']],
   prob:`La ricompensa scelta è riepilogata a destra, ma il riquadro non contiene alcun comando: niente «Cambia ricompensa», «Annulla» o «Torna al progetto». L’unico pulsante della pagina è «Dona adesso!»; per uscire restano il breadcrumb o il tasto Indietro del browser. L’importo è modificabile ma con minimo pari alla ricompensa (15 €): chi vuole donare meno o scegliere un’altra ricompensa deve tornare indietro e ripartire.`,
   heur:`Manca un’uscita chiaramente segnalata da un processo che molti aprono solo per vedere come funziona.`,
   sevj:`Il recupero richiede pochi clic, ma avviene in un punto in cui un abbandono significa una donazione persa.`,
   fix:`Link «Modifica» accanto alla ricompensa, con l’elenco delle ricompense disponibili, e «← Torna al progetto» accanto al pulsante principale.` },
 { id:'P09', h:4, sev:2, f:['A','M','A'], title:'«Come verranno usati i fondi» non ha una collocazione fissa', page:['fbr','bright'], task:[3],
   figs:[['fbr_fondi.jpg','Fai Brillare la Ricerca!: la ripartizione del budget è un’immagine, senza testo alternativo.'],['bright_fondi.jpg','BRIGHT: la stessa informazione è in un paragrafo intitolato «Di cosa abbiamo bisogno».']],
   prob:`Le descrizioni sono testi liberi molto lunghi, senza sezioni standard né indice (Fai Brillare la Ricerca!: 7.597 px su desktop; BRIGHT: 18.030 px su mobile). L’uso dei fondi è in «Di cosa abbiamo bisogno» in BRIGHT; in Fai Brillare la Ricerca! è dentro «Perché abbiamo bisogno di te?» e in un grafico inserito come immagine, privo di testo alternativo. Ciò che si impara su una pagina non aiuta a orientarsi nella successiva.`,
   heur:`Pagine dello stesso tipo non seguono una convenzione comune per le informazioni che ogni donatore cerca.`,
   sevj:`Per confrontare due progetti bisogna leggere per intero entrambe le descrizioni; vale per ogni campagna.`,
   fix:`Modello di pagina con sezioni fisse e ancore («In breve · Il team · Obiettivi · Uso dei fondi · Ricompense») e una tabella del budget in testo, non in immagine.` },
 { id:'P10', h:4, sev:2, f:['B','M','A'], title:'La pagina 404 è fuori dal modello del sito e non si adatta allo smartphone', page:['e404'], task:[8], row:true,
   figs:[['e404.jpg','404 su desktop: nessun logo, menu o footer di Ginger.',74],['m_404.jpg','404 su smartphone: testo troppo piccolo.',22]],
   prob:`La pagina 404 ha una grafica scura estranea all’identità di Ginger e non contiene logo, menu, ricerca né footer: sembra di essere usciti dal sito. Manca il meta viewport, quindi su smartphone viene resa a 980 px di larghezza e il testo risulta minuscolo.`,
   heur:`Rompe la coerenza interna (stessa intestazione in ogni pagina) e lo standard di adattarsi allo schermo, rispettato dal resto del sito.`,
   sevj:`Evento poco frequente, ma in quel momento l’utente è già in difficoltà e perde ogni punto di riferimento; si ripete identico a ogni indirizzo errato.`,
   fix:`Generare la pagina 404 dentro il modello standard, con intestazione, ricerca e footer, e con lo stesso layout responsive.` },
 { id:'P11', h:5, sev:2, f:['M','M','M'], title:'Il modulo di donazione non previene gli errori di compilazione', page:['checkout'], task:[5],
   figs:[['checkout_fields.jpg','I campi obbligatori sono segnalati solo dall’asterisco; l’email è un campo di testo generico.']],
   prob:`Dall’ispezione del modulo, che non abbiamo inviato: nessun campo obbligatorio è dichiarato tale al browser, l’email è un campo di testo generico senza controllo di formato né seconda digitazione, nessun metodo di pagamento è preselezionato e il reCAPTCHA è l’ultimo elemento. Un errore di battitura nell’email, l’unico recapito chiesto al donatore, non viene intercettato durante la compilazione.`,
   heur:`Il design non elimina le condizioni che portano all’errore, in particolare per il dato più critico.`,
   sevj:`Con un’email errata il donatore non è più raggiungibile. Il modulo non è stato inviato, quindi i controlli successivi non sono noti: per questo la severità non supera 2.`,
   fix:`Campo email con controllo di formato in linea, messaggi accanto al campo all’uscita, metodo più usato preselezionato, email riportata nel riepilogo prima della conferma.` },
 { id:'P12', h:6, sev:2, f:['M','M','M'], title:'Per ritrovare Funds TOgether bisogna ricordare che è un «Partner»', page:['menu'], task:[2,1],
